<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Klasifikasi Keparahan OA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #E3F2FA;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: 'Poppins', 'Montserrat', sans-serif;
    }

    .wave-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 160px;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 30px 20px 20px;
    }

    .logo {
      width: 90px;
      height: auto;
      margin-bottom: 20px;
      margin-top: 40px;
    }

    .gui-img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      margin: 20px 0;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      color: #183B66;
      font-weight: 600;
      margin: 0;
    }

    p.subjudul {
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      color: #183B66;
      margin: 10px 0 20px;
    }

    .start-button {
      background-color: #75D3E7;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.3s;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }

    .start-button:hover {
      background-color: #5cbcd0;
    }

    .credit {
      font-size: 14px;
      color: #527a9f;
      margin-top: 25px;
    }

    /* Gambar CNN transparan */
    .side-graphics {
  position: absolute;
  opacity: 0.3; /* Bisa ditingkatkan ke 0.4 kalau terlalu redup */
  z-index: 0;
  pointer-events: none;
}

.left-graphic {
  top: 80px; /* naik */
  left: 0;
  width: 250px; /* lebih besar */
  height: auto;
}

.right-graphic {
  bottom: 0; /* turun maksimal */
  right: 0;
  width: 400px; /* lebih besar */
  height: auto;
}

  </style>
</head>
<body>

  <!-- Gelombang -->
  <div class="wave-container">
    <svg viewBox="0 0 1440 160" preserveAspectRatio="none" style="width:100%; height:100%;">
      <path fill="#C9E1F0" d="M0,60 C240,90 480,30 720,60 C960,90 1200,30 1440,60 L1440,0 L0,0 Z" />
      <path fill="#75D3E7" d="M0,50 C240,80 480,20 720,50 C960,80 1200,20 1440,50 L1440,0 L0,0 Z" />
    </svg>
  </div>

  <!-- CNN kiri dan kanan -->
  <img src="static/cnn_left.png" alt="CNN Left" class="side-graphics left-graphic" />
  <img src="static/cnn_right.png" alt="CNN Right" class="side-graphics right-graphic" />

  <!-- Konten Utama -->
  <div class="content">
<!-- Logo -->
    <img src="static/logo.png" alt="Logo" class="logo" />

    <!-- Judul -->
    <h1>Klasifikasi Keparahan Osteoarthritis Lutut</h1>
    <p class="subjudul">Berdasarkan Citra Rontgen dengan Metode Convolutional Neural Network (CNN)</p>

    <!-- Gambar GUI (bulat) -->
    <img src="static/gui_image.png" alt="Bone Lutut" class="gui-img" />

    <!-- Tombol Start -->
    <button class="start-button" onclick="window.location.href='{{ url_for('gui2') }}'">Start Classification🦴</button>


    <!-- Footer Credit -->
    <p class="credit">Created by Rini Vamulia | 1817041055</p>
  </div>

</body>
</html>
